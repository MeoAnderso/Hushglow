# Builds, lints and tests every push and pull request, as the checks before an item is done do
# locally, apart from the tests that put windows on screen: they run only with PREVIEW_DIR set,
# for a person to look at, and are listed here as skipped.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          sw_vers

      # The tests are built too: a plain `swift build` leaves them out, and `swift test` only warns.
      - name: Build without warnings
        run: swift build --build-tests -Xswiftc -warnings-as-errors

      # A test process that has used AppKit's event loop can end with status 0 without
      # reporting, so the tests that reported passing must add up to every test there is.
      # Swift Testing reports a run per test process: one per target with some toolchains, one
      # for both with others. A skipped test is counted with those that passed, so the skipped
      # ones are named, to be seen.
      - name: Test
        run: |
          set -o pipefail
          swift test 2>&1 | tee test.log
          expected=$(grep -rhoE '@Test\b' Tests | wc -l | tr -d ' ')
          passed=$(grep -oE 'Test run with [0-9]+ tests? in [0-9]+ suites? passed' test.log \
            | awk '{ sum += $4 } END { print sum + 0 }')
          if [ "$passed" -ne "$expected" ]; then
            echo "::error::$passed tests reported passing, of the $expected there are."
            exit 1
          fi
          grep -oE 'Test [^ ]+ skipped.*' test.log | sed 's/^/::notice::/' || true

      - name: Lint
        run: swift format lint --strict --recursive Sources Tests Scripts Package.swift

      # Every string the interface looks up must be in the catalog that translations go into.
      - name: String catalog
        run: |
          Scripts/strings.sh
          git diff --exit-code Resources/Localizable.xcstrings \
            || { echo "::error::Run Scripts/strings.sh and commit Resources/Localizable.xcstrings."; exit 1; }

      - name: Build the app
        run: Scripts/build-app.sh
