# Builds, lints and tests every push and pull request, as the checks before an item is done do
# locally, apart from the pictures: PREVIEW_DIR is for a person to look at.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          sw_vers

      - name: Build without warnings
        run: swift build -Xswiftc -warnings-as-errors

      # A test process that has used AppKit's event loop can end with status 0 without
      # reporting, so both test runs, Swift Testing's for each test target, must have said so.
      - name: Test
        run: |
          set -o pipefail
          swift test 2>&1 | tee test.log
          passed=$(grep -c "Test run with .* passed" test.log || true)
          if [ "$passed" -ne 2 ]; then
            echo "::error::Expected two test runs to report passing, found $passed."
            exit 1
          fi

      - name: Lint
        run: swift format lint --strict --recursive Sources Tests Scripts Package.swift

      - name: Build the app
        run: Scripts/build-app.sh
